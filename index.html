<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teewah’s Signature — Invoice Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#faf6ee;--card:#fff;--ink:#2b2116;--mut:#7a6a52;--line:#e7dcc6;--field:#fffdf8;--g1:#E8B86D;--g2:#A67C37;--grad:linear-gradient(135deg,#E8B86D,#A67C37);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16120c;--card:#211b12;--ink:#f1e6d0;--mut:#b09c7a;--line:#3a2f1f;--field:#1a150e}}
:root[data-theme="dark"]{--bg:#16120c;--card:#211b12;--ink:#f1e6d0;--mut:#b09c7a;--line:#3a2f1f;--field:#1a150e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 Montserrat,system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 22px;background:#16100a;border-bottom:2px solid #A67C37}
header .t{font:500 26px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;text-transform:uppercase}
header .s{font-weight:300;font-size:10px;letter-spacing:.5em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.app{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:22px;padding:22px;max-width:1360px;margin:auto}
@media(max-width:980px){.app{grid-template-columns:1fr;padding:14px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h3{font:600 20px 'Cormorant Garamond',Georgia,serif;margin:0 0 10px;letter-spacing:.04em}
label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g1);outline-offset:0}
textarea{resize:vertical;min-height:58px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{border:1px solid var(--g2);background:transparent;color:var(--ink);padding:9px 14px;border-radius:999px;font:500 11px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.btn.gold{background:var(--grad);color:#2b1a05;border-color:transparent}
.btn:hover{filter:brightness(1.07)}.btn.sm{padding:6px 11px;font-size:10px}
.item{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:78px 1fr;gap:10px}
.pbox{width:78px;height:96px;border:1px dashed var(--g2);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--mut);cursor:pointer;overflow:hidden;background:var(--field)}
.pbox img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
canvas.pad{width:100%;height:110px;border:1px dashed var(--g2);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
details summary{cursor:pointer;font:600 20px 'Cormorant Garamond',serif}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;padding:10px 0;background:var(--bg)}
.pvw{overflow:hidden;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:12px;display:none;z-index:9}
/* invoice paper — always light */
#invoice{width:794px;min-height:1123px;background:#fff;color:#2b2116;padding:0 0 48px;transform-origin:top left;font:400 12px/1.5 Montserrat,sans-serif;position:relative}
#invoice .top{display:flex;justify-content:space-between;align-items:center;background:#16100a;padding:24px 52px;border-bottom:4px solid #E8B86D}
#invoice .top img{height:150px;display:block}
#invoice .co{text-align:right;color:#d9c49a;line-height:1.6;max-width:360px}
#invoice .co h1{font:500 40px/1 'Cormorant Garamond',Georgia,serif;margin:0 0 12px;letter-spacing:.2em;text-transform:uppercase;color:#E8B86D}
#invoice .co b{color:#fff;font-weight:500;font-size:13px;letter-spacing:.05em}
#invoice .band{display:flex;justify-content:space-between;background:#f7f0e1;padding:20px 52px;border-bottom:1px solid #ead9b5}
#invoice .lb{font:500 10px Montserrat,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#A67C37}
#invoice .mt td{padding:1px 0 1px 28px;text-align:right}
#invoice .in{padding:0 52px}
#invoice table.it{width:100%;border-collapse:collapse;margin-top:24px}
#invoice table.it th{font:500 10px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#A67C37;padding:9px 8px;text-align:left;border-top:1px solid #E8B86D;border-bottom:1px solid #E8B86D}
#invoice table.it td{padding:11px 8px;vertical-align:top;border-bottom:1px solid #eee3cc}
#invoice .r{text-align:right}
#invoice .nt{color:#7a6a52;margin-top:2px;white-space:pre-wrap}
#invoice .bt{display:flex;justify-content:space-between;gap:30px;margin-top:20px}
#invoice .pi{white-space:pre-wrap;margin-top:4px}
#invoice .tt{width:290px}
#invoice .tt div{display:flex;justify-content:space-between;padding:5px 8px}
#invoice .due{margin:14px 0 0 auto;width:290px;background:#f7f0e1;border:1px solid #E8B86D;padding:10px 14px}
#invoice .due .am{font:600 28px/1.2 'Cormorant Garamond',Georgia,serif;text-align:right;color:#A67C37}
#invoice .terms{margin-top:34px;padding-top:12px;border-top:1px solid #ead9b5;color:#4a3b25}
#invoice .sgn{width:300px;text-align:center;margin-top:8px}
#invoice .sgn .im{height:62px;display:flex;align-items:flex-end;justify-content:center}
#invoice .sgn img{max-height:62px;max-width:100%}
#invoice .sgn .ln{border-top:1px solid #A67C37}
#invoice .sgn small{font-size:10px;color:#7a6a52}
#invoice .pics{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;margin-top:26px}
#invoice .pics img{height:270px;max-width:240px;object-fit:cover;border:1px solid #E8B86D;border-radius:4px}
</style></head>
<body>
<header><span id="hl"></span><div class="s" style="margin-left:auto">Invoice Studio</div></header>
<div class="app">
<div id="form">
<div class="card"><h3>Invoice</h3>
<div class="g2"><div><label>Invoice no.</label><input data-k="no"></div><div><label>Currency</label><select data-k="cur"><option value="NGN">₦ NGN</option><option>KES</option><option>USD</option><option>GBP</option><option>EUR</option><option>GHS</option><option>ZAR</option></select></div>
<div><label>Date</label><input type="date" data-k="date"></div><div><label>Due date</label><input type="date" data-k="due"></div></div></div>

<div class="card"><h3>Client</h3>
<label>Name</label><input data-k="cname" placeholder="Client full name">
<div class="g2"><div><label>Phone</label><input data-k="cphone"></div><div><label>Email</label><input data-k="cemail"></div></div>
<label>Address / measurements ref.</label><textarea data-k="caddr"></textarea></div>

<div class="card"><h3>Attire &amp; items</h3><div id="items"></div>
<button class="btn sm" onclick="addItem()">+ Add item</button>
<div class="g3" style="margin-top:6px"><div><label>Discount</label><input type="number" min="0" data-k="disc"></div><div><label>Tax %</label><input type="number" min="0" data-k="tax"></div><div><label>Deposit paid</label><input type="number" min="0" data-k="dep"></div></div></div>

<div class="card"><h3>Notes &amp; payment</h3>
<label>Notes / terms</label><textarea data-k="notes"></textarea>
<label>Payment details</label><textarea data-k="pay"></textarea></div>

<div class="card"><h3>Signatures</h3>
<label>Admin / authorised name</label><input data-k="aname" placeholder="e.g. Teewah">
<label>Admin signature (saved on this device)</label><canvas class="pad" id="pad-admin" width="600" height="220"></canvas>
<div class="row"><button class="btn sm" onclick="clr('admin')">Clear</button><button class="btn sm" onclick="up('admin')">Upload image</button></div>
</div>

<div class="card"><details><summary>Business details</summary>
<label>Address</label><input data-k="baddr"><div class="g2"><div><label>Telephone</label><input data-k="bphone"></div><div><label>WhatsApp</label><input data-k="bwa"></div></div><label>Email</label><input data-k="bemail"></details></div>
</div>

<div>
<div class="bar"><button class="btn gold" onclick="dl('pdf')">Download PDF</button><button class="btn" onclick="dl('png')">Download image</button><button class="btn" onclick="newInv()">New invoice</button></div>
<div class="pvw" id="pvw"><div id="invoice"></div></div>
</div>
</div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.toISOString().slice(0,10);
function logo(id,w){return `<svg width="${w}" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8B86D"/><stop offset="1" stop-color="#A67C37"/></linearGradient></defs><g fill="url(#${id})"><path d="M18 128C18 56 74 6 100 6s82 50 82 122C170 66 128 20 100 20S30 66 18 128Z"/><path d="M68 40H132L130 50H113V62H87V50H70Z"/><path d="M86 62H114C108 74 112 84 120 106H80C88 84 92 74 86 62Z"/><path d="M95 106H105V122H95Z"/><path d="M26 140Q100 114 174 140Q100 130 26 140Z"/></g></svg>`}
$('#hl').innerHTML=`<img src="${LOGO}" alt="Teewah’s Signature" style="height:64px;display:block">`;
const def=()=>{const t=new Date(),d=new Date(Date.now()+12096e5);return{no:'TS-'+iso(t).replace(/-/g,'').slice(2)+'-001',cur:'NGN',date:iso(t),due:iso(d),cname:'',cphone:'',cemail:'',caddr:'',disc:0,tax:0,dep:0,notes:'Thank you for choosing Teewah’s Signature. Deposits are non-refundable once cutting begins. Balance is due before collection.',pay:'Bank: Opay\nAccount number: 9019952132\nAccount name: Oluwasemilore Similejesu Alebiosu',aname:'',sname:'',items:[{desc:'',note:'',qty:1,price:0,photo:''}],sig:{admin:'',client:''}}};
const biz={baddr:'No, 16 Akeem Salami Street, Olayemi, Ayobo, Lagos 100278, NG',bphone:'07061725484',bwa:'09019952132',bemail:'teewahssignature21@gmail.com'};
let S=def();
try{const l=JSON.parse(localStorage.getItem('teewah')||'{}');Object.assign(biz,l.biz||{});if(!biz.baddr)biz.baddr='No, 16 Akeem Salami Street, Olayemi, Ayobo, Lagos 100278, NG';if(!biz.bemail)biz.bemail='teewahssignature21@gmail.com';if(!biz.bphone)biz.bphone='07061725484';if(!biz.bwa)biz.bwa='09019952132';if(l.adminSig)S.sig.admin=l.adminSig;if(l.aname)S.aname=l.aname;if(l.pay)S.pay=l.pay}catch(e){}
const val=k=>k in biz?biz[k]:S[k];
function persist(){try{localStorage.setItem('teewah',JSON.stringify({biz,adminSig:S.sig.admin,aname:S.aname,pay:S.pay}))}catch(e){}}
function fillForm(){document.querySelectorAll('[data-k]').forEach(e=>e.value=val(e.dataset.k)??'');drawPads();items()}
const SYM={NGN:'₦',USD:'$',GBP:'£',EUR:'€'};
const m=n=>(SYM[S.cur]||S.cur+' ')+(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const D=s=>s?new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'—';
function render(){
 const sub=S.items.reduce((a,i)=>a+i.qty*i.price,0),af=Math.max(0,sub-S.disc),tx=af*S.tax/100,tot=af+tx,bal=Math.max(0,tot-S.dep);
 const rows=S.items.map(i=>`<tr><td><b>${esc(i.desc)||'—'}</b>${i.note?`<div class="nt">${esc(i.note)}</div>`:''}</td><td class="r">${i.qty}</td><td class="r">${m(i.price)}</td><td class="r">${m(i.qty*i.price)}</td></tr>`).join('');
 const pics=S.items.filter(i=>i.photo).map(i=>`<img src="${i.photo}">`).join('');
 const ct=[biz.bphone?'Tel: '+esc(biz.bphone):'',biz.bwa?'WhatsApp: '+esc(biz.bwa):''].filter(Boolean).join(' · ');
 $('#invoice').innerHTML=`<div class="top"><img src="${LOGO}"><div class="co"><h1>Invoice</h1><b>Teewah’s Signature</b><div>${esc(biz.baddr)}</div><div>${ct}</div><div>${esc(biz.bemail)}</div></div></div>
 <div class="band"><div><div class="lb">Bill to</div><b>${esc(S.cname)||'Client name'}</b><div>${esc(S.cphone)}</div><div>${esc(S.cemail)}</div><div style="white-space:pre-wrap">${esc(S.caddr)}</div></div>
 <table class="mt"><tr><td class="lb">Invoice #</td><td>${esc(S.no)}</td></tr><tr><td class="lb">Date</td><td>${D(S.date)}</td></tr><tr><td class="lb">Due date</td><td>${D(S.due)}</td></tr></table></div>
 <div class="in"><table class="it"><thead><tr><th>Item</th><th class="r">Quantity</th><th class="r">Price</th><th class="r">Amount</th></tr></thead><tbody>${rows}</tbody></table>
 <div class="bt"><div style="flex:1">${S.pay?`<div class="lb">Payment instruction</div><div class="pi">${esc(S.pay)}</div>`:''}${S.notes?`<div class="lb" style="margin-top:14px">Notes</div><div class="pi">${esc(S.notes)}</div>`:''}</div>
 <div class="tt"><div><span>Subtotal</span><span>${m(sub)}</span></div>${S.disc?`<div><span>Discount</span><span>− ${m(S.disc)}</span></div>`:''}${S.tax?`<div><span>Tax (${S.tax}%)</span><span>${m(tx)}</span></div>`:''}<div><span>Total</span><span>${m(tot)}</span></div>${S.dep?`<div><span>Deposit paid</span><span>− ${m(S.dep)}</span></div>`:''}</div></div>
 <div class="due"><div class="lb">Amount due</div><div class="am">${m(bal)}</div></div>
 <div class="terms">By signing this document, the customer agrees to the services and conditions described in this document.</div>
 <div class="sgn"><b>${esc(S.aname)||'Teewah’s Signature'}</b><div class="im">${S.sig.admin?`<img src="${S.sig.admin}">`:''}</div><div class="ln"></div><small>${D(S.date)}</small></div>
 ${pics?`<div class="pics">${pics}</div>`:''}</div>`;
 fit()}
function fit(){const w=$('#pvw').clientWidth,s=Math.min(1,w/794),el=$('#invoice');el.style.transform=`scale(${s})`;$('#pvw').style.height=el.offsetHeight*s+'px'}
addEventListener('resize',fit);
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k,i=t.dataset.i;
 if(k){const v=t.type==='number'?(parseFloat(t.value)||0):t.value;if(k in biz)biz[k]=v;else S[k]=v;persist();render()}
 else if(i!==undefined){const f=t.dataset.f;S.items[i][f]=t.type==='number'?(parseFloat(t.value)||0):t.value;render()}});
function items(){$('#items').innerHTML=S.items.map((it,i)=>`<div class="item"><div class="pbox" onclick="upPhoto(${i})">${it.photo?`<img src="${it.photo}">`:'+ Photo<br>of attire'}</div><div><input data-i="${i}" data-f="desc" placeholder="Item name (e.g. Hakani)" value="${esc(it.desc)}"><input data-i="${i}" data-f="note" placeholder="Details (e.g. Cargo pant, navy blue)" value="${esc(it.note)}" style="margin-top:6px"><div class="g2"><div><label>Qty</label><input type="number" min="1" data-i="${i}" data-f="qty" value="${it.qty}"></div><div><label>Unit price</label><input type="number" min="0" data-i="${i}" data-f="price" value="${it.price}"></div></div><div class="row"><button class="btn sm" onclick="rmItem(${i})">Remove</button>${it.photo?`<button class="btn sm" onclick="S.items[${i}].photo='';items();render()">Remove photo</button>`:''}</div></div></div>`).join('')}
function addItem(){S.items.push({desc:'',note:'',qty:1,price:0,photo:''});items();render()}
function rmItem(i){S.items.splice(i,1);if(!S.items.length)S.items.push({desc:'',note:'',qty:1,price:0,photo:''});items();render()}
function pick(cb){const f=$('#file');f.value='';f.onchange=()=>{const x=f.files[0];if(!x)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(x)};f.click()}
function shrink(url,max,cb){const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};im.src=url}
function upPhoto(i){pick(u=>shrink(u,700,v=>{S.items[i].photo=v;items();render()}))}
/* signature pads */
const pads={};
function initPad(k){const c=$('#pad-'+k),x=c.getContext('2d');pads[k]=c;x.lineWidth=4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#1b1409';let d=false;
 const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);const[a,b]=p(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke()};
 c.onpointermove=e=>{if(!d)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke()};
 const end=()=>{if(!d)return;d=false;S.sig[k]=c.toDataURL('image/png');if(k==='admin')persist();render()};
 c.onpointerup=end;c.onpointercancel=end}
function drawPads(){for(const k in pads){const c=pads[k],x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(S.sig[k]){const im=new Image();im.onload=()=>x.drawImage(im,0,0,c.width,c.height);im.src=S.sig[k]}}}
function clr(k){S.sig[k]='';drawPads();if(k==='admin')persist();render()}
function up(k){pick(u=>shrink(u,600,v=>{const im=new Image();im.onload=()=>{const c=pads[k],x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);const s=Math.min(c.width/im.width,c.height/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h);S.sig[k]=c.toDataURL('image/png');if(k==='admin')persist();render()};im.src=v}))}
/* export */
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
async function snap(){await document.fonts.ready;return html2canvas($('#invoice'),{scale:2,backgroundColor:'#ffffff',onclone:d=>{d.getElementById('invoice').style.transform='none'}})}
async function save(name,blob){let d=null;try{d=window.claude&&await claude.use('downloads')}catch(e){}
 if(d){try{await d.save({filename:name,data:blob});toast('Saved '+name)}catch(e){if(e.code!=='declined')toast('Could not save: '+(e.message||e.code))}}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}}
async function dl(t){try{toast('Preparing '+(t==='pdf'?'PDF':'image')+'…');const c=await snap(),n='Invoice-'+(S.no||'draft')+(S.cname?'-'+S.cname.replace(/[^\w]+/g,'_'):'');
 if(t==='png'){c.toBlob(b=>save(n+'.png',b),'image/png')}
 else{const{jsPDF}=window.jspdf,p=new jsPDF('p','mm','a4'),w=210,h=c.height*w/c.width,im=c.toDataURL('image/jpeg',.95);for(let y=0;y<h-1;y+=297){if(y)p.addPage();p.addImage(im,'JPEG',0,-y,w,h)}save(n+'.pdf',p.output('blob'))}
}catch(e){toast('Export failed — please try again')}}
function newInv(){const a=S.sig.admin,n=S.aname,p=S.pay;S=def();S.sig.admin=a;S.aname=n;S.pay=p;S.sig.client='';fillForm();render()}
initPad('admin');fillForm();render();
</script></body></html>
